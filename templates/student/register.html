<!doctype html>
<html>
<head>
  <title>Student Register</title>

  <style>
body {
  margin: 0;
  font-family: 'Poppins', sans-serif;
  background: linear-gradient(135deg, #89f7fe, #66a6ff);
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  position: relative;
}

/* ADMIN LOGIN */
.admin-login {
  position: absolute;
  top: 20px;
  right: 30px;
}

.admin-login a {
  color: #ffffff;
  background: #667eea;
  padding: 10px 18px;
  border-radius: 8px;
  text-decoration: none;
  font-weight: bold;
}

.admin-login a:hover {
  background: #764ba2;
}

/* CARD */
.register-card {
  background: #ffffff;
  padding: 40px 35px;
  border-radius: 20px;
  width: 420px;
  text-align: center;
  box-shadow: 0 15px 40px rgba(0,0,0,0.2);
}

.register-card h2 {
  margin-bottom: 25px;
  color: #1e3a8a;
  font-weight: 700;
  text-transform: uppercase;
}

/* INPUT */
.input-field {
  width: 100%;
  padding: 14px 12px;
  margin: 12px 0;
  border: 2px solid #ddd;
  border-radius: 10px;
  font-size: 15px;
}

.input-field:focus {
  border-color: #667eea;
  outline: none;
}

/* BUTTON */
.btn-primary {
  background: linear-gradient(90deg, #667eea, #764ba2);
  color: #fff;
  padding: 14px;
  width: 100%;
  border: none;
  border-radius: 10px;
  cursor: pointer;
  font-weight: bold;
  font-size: 16px;
  margin-top: 10px;
}

.btn-primary:hover {
  background: linear-gradient(90deg, #764ba2, #667eea);
}

/* FLASH */
.flash {
  padding: 10px;
  margin-bottom: 12px;
  border-radius: 8px;
  font-weight: bold;
}

.flash-success { background: #d1fae5; color: #065f46; }
.flash-error { background: #fee2e2; color: #b91c1c; }

.register-card a {
  color: #667eea;
  font-weight: bold;
  text-decoration: none;
}
  </style>
</head>

<body>

<!-- ADMIN LOGIN -->
<div class="admin-login">
  <a href="{{ url_for('admin_login') }}">Admin Login</a>
</div>

<!-- REGISTER CARD -->
<div class="register-card">
  <h2>Student Registration</h2>

  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for cat, msg in messages %}
      <div class="flash flash-{{ cat }}">{{ msg }}</div>
    {% endfor %}
  {% endwith %}

  <form method="post" autocomplete="off">

    <input type="text"
           name="roll_number"
           class="input-field"
           placeholder="Roll Number"
           required>

    <input type="password"
           name="temp_password"
           class="input-field"
           placeholder="Temporary Password (given by admin)"
           required>

    <input type="email"
           name="email"
           class="input-field"
           placeholder="Email"
           required>

    <input type="password"
           name="password"
           class="input-field"
           placeholder="Create New Password"
           required>

    <button class="btn-primary" type="submit">
      Register
    </button>

  </form>

  <p style="margin-top:15px;">
    Already registered?
    <a href="{{ url_for('login') }}">Login</a>
  </p>

</div>

</body>
</html>
