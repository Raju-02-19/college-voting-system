<!DOCTYPE html>
<html>
<head>
    <title>Students | Admin</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f9;
            margin: 0;
            padding-bottom: 40px;
        }

        h2 {
            color: #11998e;
            margin-left: 40px;
            margin-top: 40px;
        }

        table {
            width: 90%;
            margin: 10px auto 30px;
            border-collapse: collapse;
            background: #ffffff;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        th, td {
            border: 1px solid #ccc;
            padding: 10px;
            text-align: center;
        }

        th {
            background: #11998e;
            color: white;
        }

        tr:nth-child(even) {
            background: #f9f9f9;
        }

        .actions {
            width: 90%;
            margin: 20px auto;
            text-align: right;
        }

        button {
            padding: 10px 18px;
            background: #dc2626;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }

        button:hover {
            background: #b91c1c;
        }

        .verified {
            color: green;
            font-weight: bold;
        }

        .not-verified {
            color: red;
            font-weight: bold;
        }

        .empty {
            text-align: center;
            color: #777;
            padding: 20px;
        }
    </style>
</head>
<body>

<!-- 🔴 BULK DELETE FORM START -->
<form method="POST" action="{{ url_for('bulk_delete_students') }}">

<div class="actions">
    <button type="submit">🗑 Delete Selected</button>
</div>

{% for year, students in students_by_year.items() %}
<h2>{{ year }}</h2>

<table>
<tr>
    <th>Select</th>
    <th>Roll Number</th>
    <th>Branch</th>
    <th>Verified</th>
</tr>

{% for s in students %}
<tr>
    <td>
        <input type="checkbox" name="student_ids" value="{{ s._id }}">
    </td>
    <td>{{ s.roll_number }}</td>
    <td>{{ s.branch }}</td>
    <td>{{ "Yes" if s.is_verified else "No" }}</td>
</tr>
{% endfor %}
</table>
{% endfor %}

</form>

<!-- 🔴 BULK DELETE FORM END -->

</body>
</html>
