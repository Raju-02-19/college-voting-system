<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Election Settings</title>
<style>
body{
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg,#667eea,#764ba2);
    margin:0;
    min-height:100vh;
}
.navbar{
    background:#111827;
    padding:15px;
    text-align:center;
}
.navbar a{
    color:#fff;
    margin:0 15px;
    text-decoration:none;
    font-weight:bold;
}
.container{
    max-width:500px;
    background:#fff;
    margin:50px auto;
    padding:30px;
    border-radius:12px;
    box-shadow:0 10px 25px rgba(0,0,0,0.2);
}
h2{
    text-align:center;
    color:#4f46e5;
}
label{
    font-weight:bold;
    margin-top:15px;
    display:block;
}
input{
    width:100%;
    padding:10px;
    margin-top:5px;
    border-radius:6px;
    border:1px solid #ccc;
}
button{
    margin-top:20px;
    width:100%;
    padding:12px;
    background:#4f46e5;
    color:#fff;
    border:none;
    border-radius:8px;
    font-size:16px;
    cursor:pointer;
}
button:hover{
    background:#4338ca;
}
.flash-success{color:green;font-weight:bold;}
.flash-error{color:red;font-weight:bold;}
</style>
</head>
<body>

<div class="navbar">
    <a href="{{ url_for('admin_dashboard') }}">🏠 Dashboard</a>
    <a href="{{ url_for('admin_logout') }}">🚪 Logout</a>
</div>

<div class="container">
    <h2>🗓 Election Time Settings</h2>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for cat,msg in messages %}
        <p class="flash-{{ cat }}">{{ msg }}</p>
      {% endfor %}
    {% endwith %}

    <form method="POST">
        <label>Start Date</label>
        <input type="date" name="start_date" required>

        <label>Start Time</label>
        <input type="time" name="start_time" required>

        <label>End Date</label>
        <input type="date" name="end_date" required>

        <label>End Time</label>
        <input type="time" name="end_time" required>

        <button type="submit">Save Election Time</button>
    </form>
</div>

</body>
</html>
